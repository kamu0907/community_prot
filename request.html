<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>店舗掲載申請</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="./style.css">
</head>

<body>

<header class="site-header">
  <div class="container header-inner">
    <a class="page-back-link page-back-link-light" href="./community.html?id=shinagawa">← 品川コミュニティへ戻る</a>
    <p class="eyebrow">JOIN COMMUNITY</p>
    <h1>店舗掲載申請</h1>
    <p class="lead">
      コミュニティへの参加をご希望の店舗様はこちらから申請してください。
    </p>
  </div>
</header>

<main class="container">

<section class="summary-card">

<form id="request-form">

<div class="form-group">
<label>店舗名</label>
<input
type="text"
id="shopName"
required
placeholder="例：焼鳥まる">
</div>

<div class="form-group">
<label>ジャンル</label>
<input
type="text"
id="genre"
required
placeholder="例：焼鳥">
</div>

<div class="form-group">
<label>住所</label>
<input
type="text"
id="address"
placeholder="東京都品川区...">
</div>

<div class="form-group">
<label>ホームページ・SNS</label>
<input
type="url"
id="url"
placeholder="https://">
</div>

<div class="form-group">
<label>担当者名</label>
<input
type="text"
id="contactName"
placeholder="山田 太郎">
</div>

<div class="form-group">
<label>メールアドレス</label>
<input
type="email"
id="email"
placeholder="sample@example.com">
</div>

<div class="form-group">
<label>備考</label>
<textarea
id="note"
rows="5"
placeholder="営業時間やアピールポイントなど"></textarea>
</div>

<button class="reload-button" type="submit">
掲載申請する
</button>

<p
  id="result"
  class="form-result"
  role="status"
  aria-live="polite">
</p>
  
</form>

</section>

</main>

<footer class="site-footer">
<div class="container">
<p>申請内容を確認後、掲載させていただきます。</p>
</div>
</footer>

<script src="./request.js"></script>

</body>

</html>
