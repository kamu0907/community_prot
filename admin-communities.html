<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <meta
    name="theme-color"
    content="#faf6ef"
  />

  <title>コミュニティ管理</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />
  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;600;700&display=swap"
    rel="stylesheet"
  />

  <link
    rel="stylesheet"
    href="./style.css"
  />
</head>

<body>
  <header class="site-header">
    <div class="container header-inner">
      <a
        class="page-back-link page-back-link-light"
        href="./index.html"
      >
        ← コミュニティ一覧へ戻る
      </a>

      <p class="eyebrow">ADMIN</p>
      <h1>コミュニティ管理</h1>
      <p class="lead">
        作成申請の確認と承認を行います。
      </p>

      <nav class="header-nav" aria-label="管理メニュー">
        <a href="./admin-requests.html">
          店舗掲載申請
        </a>
        <a href="./admin-shops.html">
          登録済み店舗
        </a>
      </nav>

      <button
        id="logout-button"
        class="logout-button"
        type="button"
      >
        ログアウト
      </button>
    </div>
  </header>

  <main class="container">
    <section class="summary-card admin-summary">
      <div class="summary-lead">
        <p class="summary-label">
          承認待ち
        </p>

        <p class="summary-value">
          <span id="pending-count">0</span>
          <span class="summary-unit">件</span>
        </p>
      </div>

      <div class="summary-stats">
        <p class="stat">
          <span class="stat-dot dot-available"></span>
          公開中
          <span
            id="active-count"
            class="stat-count"
          >
            0
          </span>
        </p>

        <p class="stat">
          合計
          <span
            id="community-count"
            class="stat-count"
          >
            0
          </span>
        </p>
      </div>

      <button
        id="reload-communities-button"
        class="reload-button"
        type="button"
      >
        <span
          class="reload-icon"
          aria-hidden="true"
        ></span>
        <span class="reload-text">
          最新情報に更新
        </span>
      </button>
    </section>

    <section aria-labelledby="community-list-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">
            COMMUNITIES
          </p>
          <h2 id="community-list-title">
            コミュニティ一覧
          </h2>
        </div>

        <p
          id="community-last-loaded"
          class="last-loaded"
        >
          読み込み中...
        </p>
      </div>

      <div
        id="community-message"
        class="message"
        role="status"
        aria-live="polite"
      ></div>

      <div
        id="admin-community-list"
        class="request-list"
      ></div>
    </section>
  </main>
<!-- =====================================================
     コミュニティ編集モーダル
     ===================================================== -->
<div
  id="community-edit-modal"
  class="modal"
  aria-hidden="true"
>
  <div
    class="modal-overlay"
    data-close-community-modal
  ></div>

  <div
    class="modal-content"
    role="dialog"
    aria-modal="true"
    aria-labelledby="community-edit-title"
  >
    <div class="modal-header">
      <div>
        <p class="eyebrow">
          EDIT COMMUNITY
        </p>

        <h2 id="community-edit-title">
          コミュニティ編集
        </h2>
      </div>

      <button
        id="close-community-modal-button"
        class="modal-close-button"
        type="button"
        aria-label="閉じる"
      >
        ×
      </button>
    </div>

    <form id="community-edit-form">
      <input
        id="edit-community-id"
        type="hidden"
      />

      <div class="form-group">
        <label for="edit-community-name">
          コミュニティ名
          <span class="required-mark">
            必須
          </span>
        </label>

        <input
          id="edit-community-name"
          name="name"
          type="text"
          maxlength="100"
          required
        />
      </div>

      <div class="form-group">
        <label for="edit-community-area">
          エリア
          <span class="required-mark">
            必須
          </span>
        </label>

        <input
          id="edit-community-area"
          name="area"
          type="text"
          maxlength="100"
          required
        />
      </div>

      <div class="form-group">
        <label for="edit-community-description">
          説明
        </label>

        <textarea
          id="edit-community-description"
          name="description"
          rows="5"
          maxlength="1000"
        ></textarea>
      </div>

      <div class="form-group">
        <label for="edit-community-owner-name">
          申請者・担当者名
        </label>

        <input
          id="edit-community-owner-name"
          name="ownerName"
          type="text"
          maxlength="100"
        />
      </div>

      <div class="form-group">
        <label for="edit-community-email">
          メールアドレス
        </label>

        <input
          id="edit-community-email"
          name="email"
          type="email"
          maxlength="255"
        />
      </div>

      <div class="form-group">
        <label for="edit-community-status">
          公開状態
        </label>

        <select
          id="edit-community-status"
          name="status"
          required
        >
          <option value="active">
            公開
          </option>

          <option value="inactive">
            非公開
          </option>
        </select>

        <p class="form-help-text">
          非公開にすると、一般向けのコミュニティ一覧には表示されません。
        </p>
      </div>

      <div
        id="community-edit-message"
        class="message"
        role="status"
        aria-live="polite"
      ></div>

      <div class="modal-actions">
        <button
          id="cancel-community-edit-button"
          class="secondary-button"
          type="button"
        >
          キャンセル
        </button>

        <button
          id="save-community-button"
          class="approve-request-button"
          type="submit"
        >
          保存
        </button>
      </div>
    </form>
  </div>
</div>
  <footer class="site-footer">
    <div class="container">
      <p>
        コミュニティ作成申請の管理画面です。
      </p>
    </div>
  </footer>

  <script src="./admin-communities.js"></script>
</body>
</html>
